<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinançasApp PRO | Controle Financeiro Pessoal</title>
  <!-- Tailwind CSS para design moderno e responsivo -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js para gráficos interativos -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between pb-24 sm:pb-8">

  <!-- Top Header / App Bar -->
  <header class="sticky top-0 z-30 bg-slate-900/80 backdrop-blur-md border-b border-slate-800 px-4 py-3 sm:px-6">
    <div class="max-w-md sm:max-w-xl md:max-w-3xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center shadow-lg shadow-emerald-500/20">
          <i data-lucide="wallet" class="w-5 h-5 text-slate-950"></i>
        </div>
        <div>
          <h1 class="font-bold text-base sm:text-lg tracking-tight flex items-center gap-2">
            Finanças<span class="text-emerald-400">PRO</span>
            <span class="text-[10px] bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2 py-0.5 rounded-full font-semibold">VITALÍCIO</span>
          </h1>
          <p class="text-xs text-slate-400">Seu dinheiro no controle certo</p>
        </div>
      </div>
      <button onclick="resetDataPrompt()" title="Restaurar dados de exemplo" class="p-2 text-slate-400 hover:text-slate-200 hover:bg-slate-800 rounded-xl transition">
        <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
      </button>
    </div>
  </header>

  <!-- Main App Container (Mobile-first centered container) -->
  <main class="max-w-md sm:max-w-xl md:max-w-3xl mx-auto w-full px-4 pt-4 flex-1">
    
    <!-- Balance Card Principal (Estilo Cartão Fintech) -->
    <section class="relative overflow-hidden rounded-3xl bg-gradient-to-br from-slate-900 via-slate-900 to-slate-800 p-6 border border-slate-800 shadow-2xl mb-5">
      <!-- Glow effect -->
      <div class="absolute -right-10 -bottom-10 w-44 h-44 bg-emerald-500/10 rounded-full blur-3xl pointer-events-none"></div>

      <div class="flex items-center justify-between text-slate-400 text-xs font-medium uppercase tracking-wider mb-1">
        <span>Saldo Disponível</span>
        <span class="text-slate-300 font-semibold lowercase capitalize">Março 2026</span>
      </div>

      <div class="flex items-baseline gap-2 mb-6">
        <h2 id="totalBalance" class="text-3xl sm:text-4xl font-extrabold tracking-tight text-white">R$ 0,00</h2>
      </div>

      <!-- Duas pílulas: Receitas e Despesas -->
      <div class="grid grid-cols-2 gap-3 pt-4 border-t border-slate-800/80">
        <div class="bg-slate-950/60 rounded-2xl p-3 border border-slate-800/60 flex items-center gap-3">
          <div class="w-8 h-8 rounded-xl bg-emerald-500/10 flex items-center justify-center text-emerald-400">
            <i data-lucide="arrow-down-left" class="w-4 h-4"></i>
          </div>
          <div>
            <span class="text-[11px] text-slate-400 block">Entradas</span>
            <span id="totalIncome" class="font-bold text-sm text-emerald-400">R$ 0,00</span>
          </div>
        </div>

        <div class="bg-slate-950/60 rounded-2xl p-3 border border-slate-800/60 flex items-center gap-3">
          <div class="w-8 h-8 rounded-xl bg-rose-500/10 flex items-center justify-center text-rose-400">
            <i data-lucide="arrow-up-right" class="w-4 h-4"></i>
          </div>
          <div>
            <span class="text-[11px] text-slate-400 block">Saídas</span>
            <span id="totalExpense" class="font-bold text-sm text-rose-400">R$ 0,00</span>
          </div>
        </div>
      </div>
    </section>

    <!-- Seção de Ações Rápidas -->
    <div class="grid grid-cols-2 gap-3 mb-6">
      <button onclick="openModal('Receita')" class="flex items-center justify-center gap-2 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-3.5 px-4 rounded-2xl shadow-lg shadow-emerald-500/20 transition active:scale-95">
        <i data-lucide="plus-circle" class="w-5 h-5"></i>
        <span>Nova Receita</span>
      </button>

      <button onclick="openModal('Despesa')" class="flex items-center justify-center gap-2 bg-rose-500 hover:bg-rose-400 text-white font-bold py-3.5 px-4 rounded-2xl shadow-lg shadow-rose-500/20 transition active:scale-95">
        <i data-lucide="minus-circle" class="w-5 h-5"></i>
        <span>Novo Gasto</span>
      </button>
    </div>

    <!-- Gráfico de Gastos por Categoria -->
    <section class="bg-slate-900/90 border border-slate-800 rounded-3xl p-5 mb-6">
      <div class="flex items-center justify-between mb-4">
        <h3 class="font-bold text-sm tracking-wide text-slate-200 flex items-center gap-2">
          <i data-lucide="pie-chart" class="w-4 h-4 text-emerald-400"></i>
          Onde foi seu dinheiro?
        </h3>
        <span class="text-xs text-slate-400" id="catCount">0 categorias</span>
      </div>

      <div class="relative h-56 flex items-center justify-center">
        <canvas id="categoryChart"></canvas>
        <div id="noChartData" class="hidden absolute text-center text-slate-500 text-xs">
          Nenhum gasto registrado ainda neste mês.
        </div>
      </div>
    </section>

    <!-- Lista de Movimentações Recentes -->
    <section class="bg-slate-900/90 border border-slate-800 rounded-3xl p-5 mb-4">
      <div class="flex items-center justify-between mb-4">
        <h3 class="font-bold text-sm tracking-wide text-slate-200 flex items-center gap-2">
          <i data-lucide="list" class="w-4 h-4 text-emerald-400"></i>
          Últimos Lançamentos
        </h3>
        <span id="transCount" class="text-xs text-slate-400">8 itens</span>
      </div>

      <div id="transactionsList" class="space-y-3">
        <!-- Renderizado dinamicamente pelo JavaScript -->
      </div>
    </section>

  </main>

  <!-- Barra de Navegação Fixa Inferior (Estilo App Mobile) -->
  <nav class="fixed bottom-0 left-0 right-0 z-30 bg-slate-900/90 backdrop-blur-lg border-t border-slate-800 px-6 py-3 sm:hidden">
    <div class="max-w-md mx-auto flex items-center justify-around">
      <button class="flex flex-col items-center gap-1 text-emerald-400">
        <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
        <span class="text-[10px] font-semibold">Início</span>
      </button>
      <button onclick="openModal('Despesa')" class="w-12 h-12 -mt-6 bg-gradient-to-tr from-emerald-500 to-teal-400 rounded-full flex items-center justify-center text-slate-950 shadow-xl shadow-emerald-500/30 active:scale-95 transition">
        <i data-lucide="plus" class="w-6 h-6 stroke-[2.5]"></i>
      </button>
      <button onclick="exportData()" class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-200">
        <i data-lucide="download" class="w-5 h-5"></i>
        <span class="text-[10px] font-semibold">Backup</span>
      </button>
    </div>
  </nav>

  <!-- MODAL DE ADICIONAR TRANSAÇÃO -->
  <div id="transactionModal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl">
      
      <div class="flex items-center justify-between pb-4 border-b border-slate-800 mb-5">
        <h3 id="modalTitle" class="font-bold text-lg text-white flex items-center gap-2">
          Adicionar Gasto
        </h3>
        <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-slate-800 text-slate-400 hover:text-white flex items-center justify-center">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <form id="transForm" onsubmit="handleSaveTransaction(event)" class="space-y-4">
        <input type="hidden" id="transType" value="Despesa">

        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Valor (R$)</label>
          <div class="relative">
            <span class="absolute left-4 top-3 text-slate-400 font-bold">R$</span>
            <input type="number" step="0.01" id="transAmount" required placeholder="0,00" class="w-full bg-slate-950 border border-slate-800 focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 rounded-2xl py-3 pl-12 pr-4 text-white text-lg font-bold outline-none">
          </div>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Descrição</label>
          <input type="text" id="transDescription" required placeholder="Ex: Supermercado, Salário, Conta de luz" class="w-full bg-slate-950 border border-slate-800 focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 rounded-2xl py-3 px-4 text-white text-sm outline-none">
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Categoria</label>
          <select id="transCategory" class="w-full bg-slate-950 border border-slate-800 focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 rounded-2xl py-3 px-4 text-white text-sm outline-none">
            <option value="Alimentação">🍔 Alimentação</option>
            <option value="Moradia">🏠 Moradia</option>
            <option value="Transporte">🚗 Transporte</option>
            <option value="Saúde">💊 Saúde</option>
            <option value="Lazer">🍿 Lazer</option>
            <option value="Educação">📚 Educação</option>
            <option value="Assinaturas">💳 Assinaturas & Serviços</option>
            <option value="Salário">💰 Salário / Proventos</option>
            <option value="Renda Extra">⚡ Renda Extra / Vendas</option>
            <option value="Outros">📦 Outros</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Data</label>
          <input type="date" id="transDate" required class="w-full bg-slate-950 border border-slate-800 focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 rounded-2xl py-3 px-4 text-white text-sm outline-none">
        </div>

        <button type="submit" id="btnSubmitModal" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-3.5 rounded-2xl shadow-lg shadow-emerald-500/20 transition active:scale-95 mt-2">
          Salvar Lançamento
        </button>
      </form>

    </div>
  </div>

  <script>
    lucide.createIcons();

    // Chave no LocalStorage do navegador de cada pessoa
    const STORAGE_KEY = 'financas_app_pro_v1';

    const initialDemoData = [
      { id: 1, type: 'Receita', desc: 'Salário Mensal', cat: 'Salário', amount: 4500.00, date: '2026-03-05' },
      { id: 2, type: 'Receita', desc: 'Vendas Kiwify (Infoproduto)', cat: 'Renda Extra', amount: 650.00, date: '2026-03-06' },
      { id: 3, type: 'Despesa', desc: 'Aluguel & Condomínio', cat: 'Moradia', amount: 1400.00, date: '2026-03-07' },
      { id: 4, type: 'Despesa', desc: 'Supermercado Mensal', cat: 'Alimentação', amount: 720.50, date: '2026-03-08' },
      { id: 5, type: 'Despesa', desc: 'Combustível Carro', cat: 'Transporte', amount: 220.00, date: '2026-03-10' },
      { id: 6, type: 'Despesa', desc: 'Plano de Saúde', cat: 'Saúde', amount: 380.00, date: '2026-03-12' },
      { id: 7, type: 'Despesa', desc: 'Jantar Restaurante', cat: 'Lazer', amount: 185.00, date: '2026-03-15' },
      { id: 8, type: 'Despesa', desc: 'Netflix e Spotify', cat: 'Assinaturas', amount: 75.90, date: '2026-03-18' }
    ];

    let transactions = [];
    let myChart = null;

    function formatBRL(val) {
      return val.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    function loadData() {
      const stored = localStorage.getItem(STORAGE_KEY);
      if (stored) {
        try {
          transactions = JSON.parse(stored);
        } catch (e) {
          transactions = [...initialDemoData];
        }
      } else {
        transactions = [...initialDemoData];
        saveData();
      }
      renderApp();
    }

    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(transactions));
    }

    function resetDataPrompt() {
      if (confirm("Deseja restaurar os dados de demonstração?")) {
        transactions = [...initialDemoData];
        saveData();
        renderApp();
      }
    }

    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(transactions, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "meu_backup_financeiro.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function renderApp() {
      let income = 0;
      let expense = 0;
      const catTotals = {};

      transactions.forEach(t => {
        const val = parseFloat(t.amount);
        if (t.type === 'Receita') {
          income += val;
        } else {
          expense += val;
          catTotals[t.cat] = (catTotals[t.cat] || 0) + val;
        }
      });

      const balance = income - expense;

      // Cards
      document.getElementById('totalBalance').textContent = formatBRL(balance);
      document.getElementById('totalIncome').textContent = formatBRL(income);
      document.getElementById('totalExpense').textContent = formatBRL(expense);

      // Lista
      const listContainer = document.getElementById('transactionsList');
      listContainer.innerHTML = '';
      document.getElementById('transCount').textContent = `${transactions.length} lançamentos`;

      const sorted = [...transactions].reverse();

      if (sorted.length === 0) {
        listContainer.innerHTML = '<p class="text-center text-slate-500 text-xs py-6">Nenhum lançamento ainda.</p>';
      } else {
        sorted.forEach(t => {
          const isIncome = t.type === 'Receita';
          const row = document.createElement('div');
          row.className = "flex items-center justify-between p-3.5 bg-slate-950/60 rounded-2xl border border-slate-800/80 hover:border-slate-700 transition";
          
          row.innerHTML = `
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-xl ${isIncome ? 'bg-emerald-500/10 text-emerald-400' : 'bg-rose-500/10 text-rose-400'} flex items-center justify-center font-bold text-sm">
                ${isIncome ? '+' : '-'}
              </div>
              <div>
                <span class="text-sm font-semibold text-white block">${t.desc}</span>
                <span class="text-[11px] text-slate-400">${t.cat} • ${t.date}</span>
              </div>
            </div>
            <div class="flex items-center gap-3">
              <span class="font-bold text-sm ${isIncome ? 'text-emerald-400' : 'text-slate-200'}">
                ${isIncome ? '+' : '-'} ${formatBRL(parseFloat(t.amount))}
              </span>
              <button onclick="deleteTransaction(${t.id})" class="text-slate-600 hover:text-rose-400 p-1 transition" title="Excluir">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
              </button>
            </div>
          `;
          listContainer.appendChild(row);
        });
      }

      lucide.createIcons();
      updateChart(catTotals);
    }

    function updateChart(catTotals) {
      const categories = Object.keys(catTotals);
      const values = Object.values(catTotals);
      const noData = document.getElementById('noChartData');
      document.getElementById('catCount').textContent = `${categories.length} categorias`;

      if (categories.length === 0) {
        noData.classList.remove('hidden');
        if (myChart) myChart.destroy();
        return;
      }
      noData.classList.add('hidden');

      const ctx = document.getElementById('categoryChart').getContext('2d');
      if (myChart) myChart.destroy();

      myChart = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: categories,
          datasets: [{
            data: values,
            backgroundColor: [
              '#10B981', '#3B82F6', '#F59E0B', '#EC4899', 
              '#8B5CF6', '#14B8A6', '#6366F1', '#64748B'
            ],
            borderWidth: 2,
            borderColor: '#0F172A'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              position: 'right',
              labels: {
                color: '#94A3B8',
                font: { size: 11, family: "'Segoe UI', sans-serif" },
                boxWidth: 12,
                padding: 10
              }
            }
          },
          cutout: '68%'
        }
      });
    }

    function openModal(type) {
      document.getElementById('transType').value = type;
      const title = document.getElementById('modalTitle');
      const btn = document.getElementById('btnSubmitModal');
      const catSelect = document.getElementById('transCategory');

      if (type === 'Receita') {
        title.innerHTML = '<span class="w-2.5 h-2.5 rounded-full bg-emerald-400 inline-block"></span> Nova Receita';
        btn.className = "w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-3.5 rounded-2xl shadow-lg shadow-emerald-500/20 transition active:scale-95 mt-2";
        btn.textContent = "Salvar Receita";
        catSelect.value = "Salário";
      } else {
        title.innerHTML = '<span class="w-2.5 h-2.5 rounded-full bg-rose-400 inline-block"></span> Novo Gasto';
        btn.className = "w-full bg-rose-500 hover:bg-rose-400 text-white font-bold py-3.5 rounded-2xl shadow-lg shadow-rose-500/20 transition active:scale-95 mt-2";
        btn.textContent = "Salvar Gasto";
        catSelect.value = "Alimentação";
      }

      const today = new Date().toISOString().split('T')[0];
      document.getElementById('transDate').value = today;
      document.getElementById('transactionModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('transactionModal').classList.add('hidden');
      document.getElementById('transForm').reset();
    }

    function handleSaveTransaction(e) {
      e.preventDefault();
      const type = document.getElementById('transType').value;
      const amount = parseFloat(document.getElementById('transAmount').value);
      const desc = document.getElementById('transDescription').value;
      const cat = document.getElementById('transCategory').value;
      const date = document.getElementById('transDate').value;

      if (!amount || amount <= 0) {
        alert("Por favor, digite um valor válido.");
        return;
      }

      transactions.push({
        id: Date.now(),
        type,
        amount,
        desc,
        cat,
        date
      });

      saveData();
      renderApp();
      closeModal();
    }

    function deleteTransaction(id) {
      if (confirm("Excluir este lançamento?")) {
        transactions = transactions.filter(t => t.id !== id);
        saveData();
        renderApp();
      }
    }

    loadData();
  </script>
</body>
</html>
